  <!-- Bottom Accepted Payments Banner -->
  <g transform="translate(20, 540)">
    <rect x="0" y="0" width="440" height="50" rx="12" fill="#FDFBF7" stroke="#3A1D10" stroke-width="1.5" />
    <text x="220" y="20" text-anchor="middle" class="text-dark" font-size="9" font-weight="700" letter-spacing="1">MENERIMA PEMBAYARAN DARI SEMUA BANK &amp; E-WALLET</text>
    <text x="220" y="38" text-anchor="middle" class="text-dark" font-size="11" font-weight="800" fill-opacity="0.85">BCA • Mandiri • BRI • BNI • GoPay • OVO • DANA • ShopeePay</text>
